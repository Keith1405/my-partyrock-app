name: Deploy SmartMed Cycle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          for d in backend/*/; do pip install -r "$d/requirements.txt"; done

      - name: Smoke test (boot + route + guards)
        # Bedrock calls will fail without creds and stream an inline error — the
        # harness treats a reachable, streaming route as PASS, so this gates on
        # app boot, routing, CORS, and the 413 guard, not on live Bedrock.
        run: python scripts/smoke_test.py

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name smartmed-cycle \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject Function URLs into frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks --stack-name smartmed-cycle \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          URL=$(get_output ExtractfromPhotoUrl)
          sed -i "s|__URL_EXTRACT_FROM_PHOTO__|$URL|g" frontend/index.html

          URL=$(get_output MedicineCardUrl)
          sed -i "s|__URL_MEDICINE_CARD__|$URL|g" frontend/index.html

          URL=$(get_output MyMedicineSummaryUrl)
          sed -i "s|__URL_MY_MEDICINE_SUMMARY__|$URL|g" frontend/index.html

          URL=$(get_output MyReturnPlanUrl)
          sed -i "s|__URL_MY_RETURN_PLAN__|$URL|g" frontend/index.html

          URL=$(get_output SmartMedHelpUrl)
          sed -i "s|__URL_SMARTMED_HELP__|$URL|g" frontend/index.html

      - name: Sync frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name smartmed-cycle \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 sync frontend/ "s3://$BUCKET" --cache-control no-cache

      - name: Print website URL
        run: |
          aws cloudformation describe-stacks --stack-name smartmed-cycle \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text
