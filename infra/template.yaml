AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

# =============================================================================
# SmartMed Cycle — AWS SAM template.
#
# API Gateway (HTTP API) fronting Lambda handlers whose names mirror the frontend
# service seam in frontend/src/js/services/index.js. `build_medicine_card` is a
# real Bedrock-backed handler (typed Medicine Card entry); the others remain honest
# 501 placeholders until their stages.
#
# No secret, account id, or real ARN is committed here. Model id, region and the
# allowed browser origin are supplied as deploy-time parameters. Deploy only when
# the sandbox AWS settings are available (see docs/build-status.md).
# =============================================================================

Description: >
  SmartMed Cycle backend. HTTP API + Lambda. build_medicine_card uses Amazon
  Bedrock (Converse) for typed Medicine Card entry; other routes are placeholders.

Parameters:
  # Supplied at deploy time. No values committed. Logical IDs are CamelCase
  # (CloudFormation forbids AWS-prefixed parameter names); they feed the env-var
  # NAMES the Lambda code reads (BEDROCK_TEXT_MODEL_ID, etc.).
  BedrockTextModelId:
    Type: String
    Default: ""
    Description: >
      Bedrock text model id or inference-profile id (e.g. a sandbox-permitted
      Claude/Nova id). Required for build_medicine_card to work.
  BedrockVisionModelId:
    Type: String
    Default: ""
    Description: Bedrock vision model id (reserved for the photo-extraction stage).
  BedrockRegion:
    Type: String
    Default: ""
    Description: >
      Optional Bedrock region override. Leave blank to use the Lambda's own region
      (AWS_REGION). Set only if Bedrock access is in a different permitted region.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      Browser origin allowed by CORS (e.g. the CloudFront URL after first deploy,
      or http://localhost:8000 for local testing). CORS is not authentication.
      Use "*" for the first deploy, then re-deploy with the real site origin.
  LambdaExecutionRoleArn:
    Type: String
    Default: ""
    Description: >
      ARN of a PRE-EXISTING, sandbox-approved Lambda execution role to use when the
      sandbox forbids IAM role creation. If blank, SAM creates per-function roles
      (requires iam:CreateRole). The supplied role MUST allow CloudWatch Logs and
      bedrock:InvokeModel on the permitted model/inference-profile.

Conditions:
  # When no role ARN is supplied, let SAM create per-function roles (needs IAM create).
  CreateFunctionRoles: !Equals [!Ref LambdaExecutionRoleArn, ""]

Globals:
  Function:
    Runtime: python3.12
    Handler: app.build_medicine_card
    CodeUri: ../backend/lambda/
    Timeout: 29          # under the HTTP API 30s integration limit
    MemorySize: 256
    Environment:
      Variables:
        # Values come from stack parameters at deploy time. AWS_REGION is reserved
        # and provided automatically by Lambda, so it is not set here; BedrockRegion
        # is an optional override the code falls back from to AWS_REGION.
        BEDROCK_TEXT_MODEL_ID: !Ref BedrockTextModelId
        BEDROCK_VISION_MODEL_ID: !Ref BedrockVisionModelId
        BEDROCK_REGION: !Ref BedrockRegion
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # --- HTTP API in front of the Lambda handlers ---------------------------
  SmartMedApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: SmartMed Cycle API.
      # CORS so the static frontend origin can call the API from the browser.
      # (CORS restricts browsers; it is NOT auth or abuse protection.)
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
          - OPTIONS

  # --- Section 1: extract from photo --------------------------------------
  ExtractFromPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.extract_from_photo
      # Honest 501 placeholder — no Bedrock permission needed. Uses the supplied
      # sandbox role if given; otherwise SAM creates a basic logging-only role.
      Role: !If [CreateFunctionRoles, !Ref "AWS::NoValue", !Ref LambdaExecutionRoleArn]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartMedApi
            Path: /extract-from-photo
            Method: post

  # --- Section 1: medicine card (REAL Bedrock, typed entry) ---------------
  BuildMedicineCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.build_medicine_card
      # Use the supplied sandbox role if given; otherwise let SAM create one with
      # the least-privilege Bedrock policy below.
      Role: !If [CreateFunctionRoles, !Ref "AWS::NoValue", !Ref LambdaExecutionRoleArn]
      Policies: !If
        - CreateFunctionRoles
        - - Statement:
              # Least-privilege Bedrock invoke. Covers direct foundation-model
              # invocation and cross-region inference profiles (many sandbox models
              # are only invokable via an inference profile).
              - Sid: BedrockInvokeMedicineCard
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
        - !Ref "AWS::NoValue"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartMedApi
            Path: /build-medicine-card
            Method: post

  # --- Section 2: precautions summary -------------------------------------
  BuildPrecautionsSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.build_precautions_summary
      # Honest 501 placeholder — no Bedrock permission needed yet.
      Role: !If [CreateFunctionRoles, !Ref "AWS::NoValue", !Ref LambdaExecutionRoleArn]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartMedApi
            Path: /build-precautions-summary
            Method: post

  # --- Section 3: chat -----------------------------------------------------
  ChatRespondFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.chat_respond
      # Honest 501 placeholder — no Bedrock permission needed yet.
      Role: !If [CreateFunctionRoles, !Ref "AWS::NoValue", !Ref LambdaExecutionRoleArn]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartMedApi
            Path: /chat-respond
            Method: post

  # --- Section 4: return plan ----------------------------------------------
  PrepareReturnPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.prepare_return_plan
      # Honest 501 placeholder — no Bedrock permission needed yet.
      Role: !If [CreateFunctionRoles, !Ref "AWS::NoValue", !Ref LambdaExecutionRoleArn]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartMedApi
            Path: /prepare-return-plan
            Method: post

  # =========================================================================
  # Website hosting: PRIVATE S3 origin + CloudFront with Origin Access Control.
  # The bucket stays fully private (Block Public Access ON); only CloudFront can
  # read it. This avoids public-bucket settings many sandboxes forbid. If the
  # sandbox also restricts CloudFront, see docs/build-status.md for the fallback.
  # =========================================================================
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SmartMed Cycle static site
        DefaultRootObject: index.html
        # SPA-style fallback so deep links resolve to index.html.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed "CachingOptimized" policy id (stable, public constant).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # Bucket policy: allow ONLY this CloudFront distribution to read objects.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution.Id}"

Outputs:
  ApiBaseUrl:
    Description: >
      Base URL of the SmartMed API. The deploy workflow writes this into
      frontend/config.js as `apiBaseUrl` (with liveMode: true).
    Value: !Sub "https://${SmartMedApi}.execute-api.${AWS::Region}.amazonaws.com"
  MedicineCardEndpoint:
    Description: Full URL of the Medicine Card endpoint (POST).
    Value: !Sub "https://${SmartMedApi}.execute-api.${AWS::Region}.amazonaws.com/build-medicine-card"
  SiteBucketName:
    Description: S3 bucket that holds the uploaded frontend assets.
    Value: !Ref SiteBucket
  SiteDistributionId:
    Description: CloudFront distribution id (used to invalidate the cache after upload).
    Value: !Ref SiteDistribution
  SiteUrl:
    Description: Public HTTPS URL of the deployed SmartMed site (CloudFront).
    Value: !Sub "https://${SiteDistribution.DomainName}"
