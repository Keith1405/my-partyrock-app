AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SmartMed Cycle — streaming Bedrock Lambdas (Flask + Lambda Web Adapter),
  Function URLs, and an S3 static website bucket for the frontend.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256

Resources:

  # ---------------------------------------------------------------------------
  # IAM role shared by all text Lambdas
  # ---------------------------------------------------------------------------
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SmartMedCycleBedrockRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource:
                  # Claude 3 Haiku — regional foundation model. * for region
                  # keeps the policy valid regardless of deploy region.
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

  # ---------------------------------------------------------------------------
  # Text AI Lambdas (Flask + Lambda Web Adapter, response streaming)
  # ---------------------------------------------------------------------------
  ExtractfromPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/extract_from_photo/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  MedicineCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/medicine_card/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  MyMedicineSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/my_medicine_summary/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  MyReturnPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/my_return_plan/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  SmartMedHelpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/smartmed_help/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ---------------------------------------------------------------------------
  # S3 static website hosting for the frontend
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub smartmed-cycle-frontend-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

Outputs:
  ExtractfromPhotoUrl:
    Description: Function URL for the Extract from Photo Lambda
    Value: !GetAtt ExtractfromPhotoFunctionUrl.FunctionUrl
  MedicineCardUrl:
    Description: Function URL for the Medicine Card Lambda
    Value: !GetAtt MedicineCardFunctionUrl.FunctionUrl
  MyMedicineSummaryUrl:
    Description: Function URL for the My Medicine Summary Lambda
    Value: !GetAtt MyMedicineSummaryFunctionUrl.FunctionUrl
  MyReturnPlanUrl:
    Description: Function URL for the My Return Plan Lambda
    Value: !GetAtt MyReturnPlanFunctionUrl.FunctionUrl
  SmartMedHelpUrl:
    Description: Function URL for the SmartMed Help chat Lambda
    Value: !GetAtt SmartMedHelpFunctionUrl.FunctionUrl
  WebsiteUrl:
    Description: S3 static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Description: Frontend S3 bucket name
    Value: !Ref FrontendBucket
